{% extends 'headers.html' %}

{% block page %}

<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="i-newspaper" viewBox="0 0 24 24"><path d="M4 4h13v15a1 1 0 0 0 1 1H5a1 1 0 0 1-1-1z"/><path d="M17 8h3v11a1 1 0 0 1-2 0"/><path d="M7 8h7M7 12h7M7 16h4"/></symbol>
    <symbol id="i-apps" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-store" viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v2a3 3 0 0 1-5.3 2 3 3 0 0 1-5.4 0A3 3 0 0 1 4 11z"/><path d="M5.5 14v6h13v-6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>
    <symbol id="i-log" viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h10M4 18h7"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-drag" viewBox="0 0 24 24"><path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8"/><path d="M20 3v5h-5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M8.5 8.5h.01M15.5 8.5h.01M12 12h.01M8.5 15.5h.01M15.5 15.5h.01" stroke-width="2.6"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-take-out" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a15.6 15.6 0 0 1-2.4 3M6.6 6.6C4.3 8.1 3 12 3 12s4 6 9 6a8.8 8.8 0 0 0 4.4-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5h.01"/></symbol>
    <symbol id="i-bluetooth" viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="12" r="2"/></symbol>
    <symbol id="i-github" viewBox="0 0 24 24"><path d="M9 19c-4 1.5-4-2-6-2.5M15 21v-3.5a3 3 0 0 0-.9-2.3c3-.3 6-1.5 6-6.7a5.2 5.2 0 0 0-1.4-3.6 4.8 4.8 0 0 0-.1-3.6s-1.1-.3-3.6 1.4a12.4 12.4 0 0 0-6.5 0C6 1.1 4.9 1.4 4.9 1.4a4.8 4.8 0 0 0-.1 3.6 5.2 5.2 0 0 0-1.4 3.6c0 5.2 3 6.4 6 6.7a3 3 0 0 0-.9 2.3V21"/></symbol>
</svg>

<header class="mobile-top">
    <a class="masthead" href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='theticketpost_horizontal_white.svg') }}" alt="TheTicketPost"></a>
    <span class="printer-status" data-printer-status><span class="dot off"></span><span>No printer</span></span>
</header>

<div class="layout">
    <aside class="sidebar">
        <a class="masthead" href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='theticketpost_horizontal_white.svg') }}" alt="TheTicketPost"></a>
        <nav class="nav" aria-label="Main">
            <a class="nav-link {{ 'active' if active_page == 'dashboard' }}" href="{{ url_for('home') }}" {{ 'aria-current=page' if active_page == 'dashboard' }}>
                <svg class="i" aria-hidden="true"><use href="#i-newspaper"/></svg>
                Newspaper
            </a>
            <a class="nav-link {{ 'active' if active_page == 'apps' }}" href="{{ url_for('apps') }}" {{ 'aria-current=page' if active_page == 'apps' }}>
                <svg class="i" aria-hidden="true"><use href="#i-apps"/></svg>
                My apps
            </a>
            <a class="nav-link {{ 'active' if active_page == 'store' }}" href="{{ url_for('store') }}" {{ 'aria-current=page' if active_page == 'store' }}>
                <svg class="i" aria-hidden="true"><use href="#i-store"/></svg>
                App store
                <span class="count" data-update-count hidden></span>
            </a>
            <a class="nav-link {{ 'active' if active_page == 'settings' }}" href="{{ url_for('settings') }}" {{ 'aria-current=page' if active_page == 'settings' }}>
                <svg class="i" aria-hidden="true"><use href="#i-settings"/></svg>
                Settings
            </a>
            <a class="nav-link {{ 'active' if active_page == 'log' }}" href="{{ url_for('log') }}" {{ 'aria-current=page' if active_page == 'log' }}>
                <svg class="i" aria-hidden="true"><use href="#i-log"/></svg>
                Log
            </a>
            <a class="nav-link desktop-only {{ 'active' if active_page == 'about' }}" href="{{ url_for('about') }}" {{ 'aria-current=page' if active_page == 'about' }}>
                <svg class="i" aria-hidden="true"><use href="#i-info"/></svg>
                About
            </a>
        </nav>
        <div class="sidebar-foot">
            <a class="printer-status" href="{{ url_for('settings') }}" data-printer-status><span class="dot off"></span><span>No printer</span></a>
            <a href="https://github.com/theticketpost">v{{ version }} · GitHub</a>
        </div>
    </aside>

    <main class="content {{ 'narrow' if narrow }} {{ 'fill' if fill }}">
        {% block content %}
        {% endblock %}
    </main>
</div>
{% endblock %}
