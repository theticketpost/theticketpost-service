{% extends 'base.html' %}

{% set active_page = 'log' %}
{% set fill = true %}

{% block content %}
<div id="log-app" class="stack" style="flex: 1" v-cloak>
    <header class="page-head">
        <div>
            <span class="eyebrow">Live service output</span>
            <h1 class="page-title">Log</h1>
        </div>
        <div class="actions">
            <button type="button" class="btn btn-ghost" :aria-pressed="autoscroll" @click="autoscroll = !autoscroll">
                Autoscroll { autoscroll ? 'on' : 'off' }
            </button>
            <button type="button" class="btn btn-danger" @click="clear_log()">Clear log</button>
        </div>
    </header>
    <pre id="output" class="log-output" tabindex="0" aria-label="Log output"></pre>
</div>

<script type="text/javascript" src="{{ url_for('static', filename='js/log.js') }}"></script>
{% endblock %}
