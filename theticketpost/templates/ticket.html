<div v-if="loaded" id="newspaper" :style="{width: ticket_px_width + 'px'}">
    <vuedraggable v-model="apps" item-key="id" class="ticket-list" :class="{ 'is-empty': editable && apps.length == 0 }" handle=".handle"
        :group="{ name: 'sections', pull: false }" :force-fallback="true" :disabled="!editable" :move="allow_move"
        @start="drag_start" @end="on_reorder" @change="on_change">
        <template #item="{ element, index }">
            <div class="ticket-item" :class="{ selected: editable && selected === index, 'is-group': is_group(element), 'merge-target': editable && merge_target === element,
                    'not-printed': !editable && skip_reason(index), 'will-skip': editable && skip_reason(index) }"
                :data-id="element.id" @click="select(index)">
                <div v-if="editable && merge_target === element" class="merge-hint" aria-hidden="true">
                    <svg class="i"><use href="#i-dice"/></svg>
                    { is_group(element) ? 'Drop to add it to this random section' : 'Drop to join them in a random section' }
                </div>
                <div v-if="editable && selected === index" class="item-tools" @click.stop>
                    <button type="button" class="handle" aria-label="Drag to reorder" title="Drag to reorder"><svg class="i" aria-hidden="true"><use href="#i-drag"/></svg></button>
                    <button type="button" aria-label="Refresh section" title="Refresh" @click="refresh(element)"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg></button>
                    <button v-if="!is_group(element)" type="button" aria-label="Turn into a random section" title="Random section: a different app each day" @click="make_group(index)"><svg class="i" aria-hidden="true"><use href="#i-dice"/></svg></button>
                    <button type="button" aria-label="Remove section" title="Remove" @click="del(index)"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg></button>
                </div>
                <!-- editor only: a random section shows one alternative at a time -->
                <div v-if="editable && is_group(element)" class="group-bar" @click.stop="select(index)">
                    <svg class="i" aria-hidden="true"><use href="#i-dice"/></svg>
                    <span class="group-label" :title="element.mode === 'random' ? 'A random one prints each day' : 'A different one prints each day, in turn'">{ element.mode === 'random' ? 'Random' : 'Daily' }</span>
                    <span class="group-count"><span class="group-app">{ current(element).appname }</span> · { element.shown + 1 } of { element.items.length }</span>
                    <button type="button" aria-label="Previous alternative" @click.stop="step(index, -1)"><svg class="i" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
                    <button type="button" aria-label="Next alternative" @click.stop="step(index, 1)"><svg class="i" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
                </div>
                <!-- editor only: sections left out of today's print, and ties to a neighbour -->
                <div v-if="editable && (skip_reason(index) || element.link)" class="print-note">
                    <svg class="i" aria-hidden="true"><use :href="element.link ? '#i-link' : '#i-eye-off'"/></svg>
                    <span v-if="skip_reason(index) === 'empty'">Not printed today: nothing to show</span>
                    <span v-else-if="skip_reason(index) === 'linked'">Not printed today: goes with the section { element.link === 'next' ? 'below' : 'above' }</span>
                    <span v-else>Prints only with the section { element.link === 'next' ? 'below' : 'above' }</span>
                </div>
                <!-- the box apps lay out against (e.g. sudoku's absolute grid) -->
                <div class="ticket-body">
                    <div v-if="editable && !current(element).rawhtml" class="ticket-loading"><span class="spinner" aria-hidden="true"></span>Adding { current(element).appname }…</div>
                    <div v-html="current(element).rawhtml"></div>
                </div>
            </div>
        </template>
    </vuedraggable>
    <div v-if="editable && apps.length == 0" class="ticket-empty">Drag a section here to start your newspaper.</div>
</div>
